#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: dynamodb
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads"

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.5
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5.5
      extension_name: dynamodb
      format_checks: 'format'

  dynamodb-sql-tests:
    name: Run SQL Extension Tests
    needs: duckdb-stable-build
    runs-on: ubuntu-latest

    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          pattern: '*linux_amd64*'
          path: build/release/extension/dynamodb

      - name: Download DuckDB Unittest Binary
        uses: actions/download-artifact@v4
        with:
          pattern: '*unittest*'
          path: build/release/test

      # Seed the DynamoDB Local table before tests run
      - name: Seed DynamoDB Mock Data
        env:
          AWS_ACCESS_KEY_ID: 'DUMMY'
          AWS_SECRET_ACCESS_KEY: 'DUMMY'
          AWS_DEFAULT_REGION: 'us-east-1'
          DYNAMODB_ENDPOINT_URL: 'http://localhost:8000'
        run: |
          pip install boto3
          python test/seed_local_dynamodb.py

      - name: Run SQL Tests
        env:
          AWS_ACCESS_KEY_ID: 'DUMMY'
          AWS_SECRET_ACCESS_KEY: 'DUMMY'
          AWS_DEFAULT_REGION: 'us-east-1'
          DYNAMODB_ENDPOINT_URL: 'http://localhost:8000'
          DYNAMODB_TEST_ENDPOINT: 1
        run: |
          chmod +x build/release/test/unittest
          build/release/test/unittest "test/sql/*"
